name: Build Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-installer.yml

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: MaBa44/5250ng
          ref: 1.2.0-fix
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install OpenSSL via vcpkg
        run: vcpkg install openssl:x64-windows

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value.Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Package
        shell: pwsh
        run: |
          mkdir deploy\5250ng
          copy build\bin\Release\5250ng.exe deploy\5250ng\
          windeployqt --release deploy\5250ng\5250ng.exe
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\libcrypto-3-x64.dll") {
            copy "$vcpkgBin\libcrypto-3-x64.dll" deploy\5250ng\
            copy "$vcpkgBin\libssl-3-x64.dll" deploy\5250ng\
          }

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\5250ng.iss
          Get-ChildItem installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe
